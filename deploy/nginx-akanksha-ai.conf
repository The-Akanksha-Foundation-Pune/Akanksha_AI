# Akanksha AI under https://tether.akanksha.org/akanksha-ai/
#
# Paste these blocks into /etc/nginx/conf.d/tether.conf, inside the existing `server { ... }` for
# tether.akanksha.org, ABOVE the Timetable `/api/` catch-all. nginx picks the longest matching
# prefix, so /akanksha-ai/api/... goes here and not to another app.
#
# The trailing slash on proxy_pass strips the /akanksha-ai/ prefix, so Express sees /api/chat,
# /api/modules/... and so on, exactly as in development. The client is built with
# VITE_BASE_PATH=/akanksha-ai/ and Express serves it (SERVE_CLIENT=1), so one block covers the page,
# its assets and the API. Change 5080 if PORT in .env is different.

location /akanksha-ai/ {
    proxy_pass http://127.0.0.1:5080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection "";

    # Answers are streamed (server-sent events): pass each piece on as it arrives, and give a long
    # analysis time to finish.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    client_max_body_size 2m;
}

location = /akanksha-ai {
    return 301 /akanksha-ai/;
}
